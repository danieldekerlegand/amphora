services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T19-44-55Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: amphora
      MINIO_ROOT_PASSWORD: amphora-secret
    ports:
      - "9000:9000"
      - "9001:9001"

  create-bucket:
    image: minio/mc:RELEASE.2024-06-13T19-44-55Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 amphora amphora-secret; do sleep 1; done &&
      mc mb --ignore-existing local/amphora-uploads"

  tusd:
    image: tusproject/tusd:v2.4.0
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: amphora
      AWS_SECRET_ACCESS_KEY: amphora-secret
      AWS_REGION: us-east-1
    command:
      - -host=0.0.0.0
      - -port=8080
      - -s3-bucket=amphora-uploads
      - -s3-endpoint=http://minio:9000
      - -s3-object-prefix=uploads/
      - -behind-proxy
    ports:
      - "8080:8080"
