# Every image is pinned by digest, not by tag.
#
# This file used to pin minio/minio and minio/mc to RELEASE.2024-06-13T19-44-55Z. Both tags were
# later withdrawn from Docker Hub — `docker manifest inspect` answers "no such manifest" — and the
# harness failed at `compose up` on every machine, which is how a pin meant to guarantee
# reproducibility became the thing that broke it. A `RELEASE.*` tag is mutable inventory: MinIO
# prunes old ones. A digest is content-addressed, so it can never be repointed at different bytes,
# and a tag rename cannot strand it. (A digest is not immortal — a repository can still delete the
# manifest — but it removes the far more common failure of the tag simply moving or being retired.)
#
# When bumping: pull the tag, read `docker image inspect --format '{{index .RepoDigests 0}}'`, and
# record the human-readable release beside the digest so the pin stays auditable.
#
# MinIO is pulled from quay.io, not Docker Hub — 2026-09-12. Docker Hub's `minio/minio` stopped
# answering anonymous pulls entirely: `registry-1.docker.io/v2/minio/minio/manifests/<ref>` returns
# 401 for the digest below AND for `latest`, so it is the repository that is gated, not a rotted
# digest (`tusproject/tusd` on the same registry still answers 200). The `android` job failed at
# `compose up` with `pull access denied for minio/minio, repository does not exist or may require
# 'docker login'` on run 34675398053. quay.io serves the SAME manifest list — its
# docker-content-digest for `RELEASE.2025-09-07T16-13-09Z` is the identical
# sha256:14cea493…8936e — so this is a registry change and provably not an image change. That is
# the property a digest pin is for: the bytes are addressed, the host is only where they are kept.
services:
  minio:
    # quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # No --console-address: the community image dropped the admin console, and this harness never
    # used it. One less flag and one less published port to collide with.
    command: server /data
    environment:
      MINIO_ROOT_USER: amphora
      MINIO_ROOT_PASSWORD: amphora-secret
    ports:
      - "9000:9000"

  create-bucket:
    # Reuses the minio image on purpose. `mc` ships inside it at /usr/bin/mc, so the separate
    # minio/mc pin bought nothing but a second tag that could rot independently — and did.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 amphora amphora-secret; do sleep 1; done &&
      mc mb --ignore-existing local/amphora-uploads"

  tusd:
    # tusproject/tusd:v2.4.0
    image: tusproject/tusd@sha256:6c5e17dcb9441d773b7547a5b0eaa356ea77b6a4b6b35ce5cb25660b9a164e58
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: amphora
      AWS_SECRET_ACCESS_KEY: amphora-secret
      AWS_REGION: us-east-1
    command:
      - -host=0.0.0.0
      - -port=8080
      - -s3-bucket=amphora-uploads
      - -s3-endpoint=http://minio:9000
      - -s3-object-prefix=uploads/
      - -behind-proxy
    ports:
      - "8080:8080"
