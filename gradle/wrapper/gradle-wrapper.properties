# Pinned deliberately. `gradle :android:assemble` on a runner uses whatever Gradle the image
# happens to ship (it was 9.7.0 on 2026-08-27), so the build was not reproducible and a runner
# image bump could break it without a commit. Both the distribution and the wrapper jar are
# checksum-pinned; CI additionally runs gradle/actions/wrapper-validation, which checks
# gradle-wrapper.jar against Gradle's published list of known-good wrapper jars.
#
# 8.10.2 is chosen to match AGP 8.6.1 (requires Gradle >= 8.7) and Kotlin 2.0.21.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
distributionSha256Sum=31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
