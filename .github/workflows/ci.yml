name: CI

# TRIGGER — deliberate, do not "tidy" this back to `pull_request` alone.
#
# Work does not arrive here through pull requests. Chief merges a finished tasklist
# branch into `main` LOCALLY (`--no-ff`) and then pushes `main`; no PR is ever opened.
# A `pull_request`-only trigger would therefore never fire even once — that is exactly
# how the sibling repository `vita` ended up with a workflow that had never run.
#
# `push` on the default branch is the trigger that matches how commits actually land.
# `chief/**` is included so a tasklist branch is built BEFORE it is merged rather than
# only after. `pull_request` is retained for humans who do open one, and
# `workflow_dispatch` so a run can be forced without inventing a commit.
on:
  push:
    branches:
      - main
      - 'chief/**'
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift target with warnings as errors
        run: swift build --package-path ios -Xswiftc -warnings-as-errors
      - name: Run Swift path tests
        run: swift run --package-path ios AmphoraPathTests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      # gradle-wrapper.jar is a committed binary. This checks it against Gradle's published
      # list of known-good wrapper jars, so the blob cannot be quietly swapped.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # ./gradlew, not `gradle`: the runner image's own Gradle is whatever it happens to ship
      # (9.7.0 on 2026-08-27) and can change under us without a commit here.
      - name: Build Android library
        run: ./gradlew --no-daemon :android:assemble
      - name: Run Android conformance vectors
        run: ./gradlew --no-daemon :android:testDebugUnitTest

  # A gate that cannot run reports success, which is worse than having no gate. `.chief/verify.sh`
  # deliberately reports SKIPPED as a third outcome and treats it as FATAL when CI=true — this job
  # is the counterfactual that proves it, running verify.sh with an emptied PATH and asserting the
  # local verdict (SKIPPED, exit 0) and the CI verdict (FAIL, non-zero) actually differ.
  # See docs/reference/continuous-integration.md#a-skipped-check-is-not-a-passing-check.
  verify-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A skipped check must never read as a passing one
        run: .chief/tests/verify-skip-policy.sh

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci
      - run: npm run check:control-surface
      - run: npm run typecheck
      - run: npm run build
