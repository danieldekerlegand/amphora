name: CI

on:
  push:
  pull_request:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift target with warnings as errors
        run: swift build --package-path ios -Xswiftc -warnings-as-errors
      - name: Run Swift path tests
        run: swift run --package-path ios AmphoraPathTests

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android library
        run: gradle :android:assemble
      - name: Run Android conformance vectors
        run: gradle :android:testDebugUnitTest

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci
      - run: npm run check:control-surface
      - run: npm run typecheck
      - run: npm run build
