name: CI

on:
  push:
  pull_request:

jobs:
  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci
      - run: npm run check:control-surface
      - run: npm run typecheck
      - run: npm run build
