name: CI

# TRIGGER — deliberate, do not "tidy" this back to `pull_request` alone.
#
# Work does not arrive here through pull requests. Chief merges a finished tasklist
# branch into `main` LOCALLY (`--no-ff`) and then pushes `main`; no PR is ever opened.
# A `pull_request`-only trigger would therefore never fire even once — that is exactly
# how the sibling repository `vita` ended up with a workflow that had never run.
#
# `push` on the default branch is the trigger that matches how commits actually land.
# `chief/**` is included so a tasklist branch is built BEFORE it is merged rather than
# only after. `pull_request` is retained for humans who do open one, and
# `workflow_dispatch` so a run can be forced without inventing a commit.
on:
  push:
    branches:
      - main
      - 'chief/**'
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Name the compiler that produced whatever follows. This job has been red on concurrency
      # errors the authoring machine's newer toolchain does not emit at all, and run 34556064209's
      # log does not say which Swift it used — so the next divergence between the two is arguable
      # from the log instead of guessed at.
      - name: Swift and Xcode versions
        run: |
          swift --version
          xcodebuild -version
      - name: Build Swift target with warnings as errors
        run: swift build --package-path ios -Xswiftc -warnings-as-errors
      - name: Run Swift path tests
        run: swift run --package-path ios AmphoraPathTests
      # Green vectors prove the two ports AGREE. They do not prove the suite would NOTICE if they
      # stopped agreeing. This introduces a divergence into the Swift port on purpose and requires
      # the vectors to go red — see Tests/Conformance/drift-control.sh.
      - name: Swift drift negative control
        run: Tests/Conformance/drift-control.sh --port swift

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      # gradle-wrapper.jar is a committed binary. This checks it against Gradle's published
      # list of known-good wrapper jars, so the blob cannot be quietly swapped.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # ./gradlew, not `gradle`: the runner image's own Gradle is whatever it happens to ship
      # (9.7.0 on 2026-08-27) and can change under us without a commit here.
      - name: Build Android library
        # --stacktrace: the kapt worker failures this job has hit print nothing else.
        run: ./gradlew --no-daemon --stacktrace :android:assemble
      - name: Run Android conformance vectors
        run: ./gradlew --no-daemon :android:testDebugUnitTest
      # THE REAL WIRE. Tasklist 80 recorded "both platforms complete an upload against a real tusd
      # instance" as passing while its own notes said Android Gradle was unavailable and Docker was
      # unreachable. No JDK exists on the machines these stories are written on, so this runner is
      # the only place the Kotlin port can be put on a socket — and ubuntu-latest ships Docker, so
      # there was never a reason it could not be.
      - name: Start tusd + MinIO
        run: |
          docker compose -f integration/tusd/docker-compose.yml up -d
          # No `-f`: GET on the collection answers 405, which is the server being up, not an error.
          for _ in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8080/files/ && break; sleep 1; done
          curl -s -o /dev/null -w 'tusd is up: HTTP %{http_code}\n' http://127.0.0.1:8080/files/
      - name: Kotlin real-wire upload against tusd
        env:
          TUSD_ENDPOINT: http://127.0.0.1:8080/files/
          # Turns "no endpoint, skipping" into a failure. This step exists to produce evidence, and
          # a step that can pass without producing any is how the false record got written.
          AMPHORA_REQUIRE_DOCKER: '1'
        run: ./gradlew --no-daemon :android:testDebugUnitTest --tests 'dev.amphora.TusdIntegrationTest'
      # The observation itself, in the log. The step above going green says an upload finished;
      # this says how many bytes, from which resumed offset, and how much disk it took — which is
      # what a later reader needs in order to believe it without rerunning it.
      - name: What crossed the wire
        if: always()
        run: |
          cat android/build/reports/tusd-real-wire.txt \
            || echo 'NO EVIDENCE LINE — the upload did not reach the end of the test.'
      - name: Stop tusd + MinIO
        if: always()
        run: docker compose -f integration/tusd/docker-compose.yml down -v --remove-orphans
      # The Kotlin half of the same counterfactual, and the half that matters most here: no JDK
      # exists on the machines these stories are written on, so CI is the only place the Kotlin
      # vectors have ever been driven red.
      - name: Kotlin drift negative control
        run: Tests/Conformance/drift-control.sh --port kotlin

  # The vectors only detect drift while both ports read the SAME bytes. A per-platform copy would
  # leave both suites green while they describe two different state machines — the exact failure
  # the fixture exists to prevent, and an invisible one. So the "one file" invariant is a gate
  # rather than a comment. Cheap: it reads the git index, no toolchain, no build.
  conformance-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: One vectors.json, read by both ports
        run: Tests/Conformance/check-single-fixture.sh

  # A gate that cannot run reports success, which is worse than having no gate. `.chief/verify.sh`
  # deliberately reports SKIPPED as a third outcome and treats it as FATAL when CI=true — this job
  # is the counterfactual that proves it, running verify.sh with an emptied PATH and asserting the
  # local verdict (SKIPPED, exit 0) and the CI verdict (FAIL, non-zero) actually differ.
  # See docs/reference/continuous-integration.md#a-skipped-check-is-not-a-passing-check.
  verify-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A skipped check must never read as a passing one
        run: .chief/tests/verify-skip-policy.sh

  react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/react-native/package-lock.json
      - run: npm ci
      - run: npm run check:control-surface
      - run: npm run typecheck
      - run: npm run build
