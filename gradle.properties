# 4g, not 2g. `:android:assemble` runs kaptDebugKotlin and kaptReleaseKotlin concurrently, both
# in-process, and at 2g the android CI job died inside one of them on two of three runs
# (33041928703 killed kaptReleaseKotlin, 33042386253 killed kaptDebugKotlin) with no diagnostic
# beyond "A failure occurred while executing KaptExecutionWorkAction" — the shape a worker that
# ran out of heap leaves behind. A rerun of the identical commit passed, which is what makes it
# expensive: an intermittently red job is one people learn to rerun rather than read. The CI step
# also passes --stacktrace now, so the next occurrence says something rather than nothing.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
